services:
  db:
    image: mariadb:11.4
    container_name: postit-db
    environment:
      MARIADB_DATABASE: postit
      MARIADB_USER: postit
      MARIADB_PASSWORD: postit
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - postit-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: postit-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: postit
      DB_USER: postit
      DB_PASSWORD: postit
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: postit-frontend
    environment:
      PORT: 3000
      API_URL: http://backend:8080
      ENV: dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postit-db-data:
