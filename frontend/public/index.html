<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post-it Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-title-row">
            <h1>Post-it Tasks</h1>
            <span id="env-badge" class="env-badge" hidden aria-live="polite"></span>
          </div>
          <p>Sticky-note style reminders</p>
        </div>
      </div>
      <button id="btn-new" class="btn primary" type="button">+ New sticky note</button>
    </header>

    <main id="board" class="board" aria-label="Sticky notes board"></main>

    <dialog id="task-dialog">
      <form id="task-form" method="dialog">
        <h2 id="dialog-title">New sticky note</h2>
        <label>
          Title
          <input id="field-title" name="title" maxlength="120" required placeholder="e.g. Buy coffee" />
        </label>
        <label>
          Content
          <textarea
            id="field-content"
            name="content"
            maxlength="2000"
            rows="4"
            placeholder="Reminder details..."
          ></textarea>
        </label>
        <fieldset class="colors">
          <legend>Color</legend>
          <label class="swatch"><input type="radio" name="color" value="yellow" checked /><span class="c-yellow"></span></label>
          <label class="swatch"><input type="radio" name="color" value="pink" /><span class="c-pink"></span></label>
          <label class="swatch"><input type="radio" name="color" value="mint" /><span class="c-mint"></span></label>
          <label class="swatch"><input type="radio" name="color" value="blue" /><span class="c-blue"></span></label>
          <label class="swatch"><input type="radio" name="color" value="peach" /><span class="c-peach"></span></label>
        </fieldset>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
