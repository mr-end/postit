apiVersion: v1
kind: ConfigMap
metadata:
  name: postit-config
data:
  # DB_NAME / DB_USER live only in secret.yaml (MARIADB_DATABASE / MARIADB_USER)
  # to avoid duplicating values that must match the MariaDB bootstrap env vars.
  DB_HOST: REPLACE_ME_DB_HOST
  DB_PORT: REPLACE_ME_DB_PORT
  API_URL: REPLACE_ME_API_URL
  PORT: REPLACE_ME_PORT
  ENV: REPLACE_ME_ENV
