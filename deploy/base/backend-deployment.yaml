apiVersion: apps/v1
kind: Deployment
metadata:
  name: postit-backend
  labels:
    app.kubernetes.io/name: postit-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postit-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postit-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: postit-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: postit-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postit-db
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postit-db
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postit-db
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
