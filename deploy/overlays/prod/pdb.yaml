apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postit-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postit-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postit-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postit-frontend
