apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postit-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: configmap.yaml
  # secret.yaml is intentionally NOT patched here — it's gitignored and applied
  # out-of-band (kubectl apply), so Argo CD never needs it. See deploy/README.md.
  - path: pvc.yaml
  - path: route.yaml
  - path: patches/backend-replicas.yaml
  - path: patches/frontend-replicas.yaml

images:
  - name: postit-backend
    newName: ghcr.io/mr-end/postit/postit-backend
    newTag: latest
  - name: postit-frontend
    newName: ghcr.io/mr-end/postit/postit-frontend
    newTag: latest

labels:
  - pairs:
      environment: dev
      app.kubernetes.io/instance: postit-dev
      app.kubernetes.io/part-of: postit
    includeSelectors: false
